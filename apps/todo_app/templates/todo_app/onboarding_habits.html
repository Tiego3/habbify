{% extends "todo_app/base.html" %}
{% load static %}
{% block title %}Your Habits{% endblock %}
{% block content %}
<div class="landing-card landing-card--wide">
    <div class="app-icon app-icon--warm">
        <i class="fa-solid fa-heart"></i>
    </div>
    <h1>Almost there, {{ user_name }}! 🎯</h1>
    <p class="auth-intro">Tell me about your habits so I can help you crush them!</p>

    <form method="post">
        {% csrf_token %}

        <div id="habits-container" class="field-list">
            <div class="habit-input">
                <label class="form-label">Habit 1</label>
                <input type="text" name="habit_1" placeholder="e.g. Drink 2L of water" class="text-input">
            </div>
        </div>

        <div class="form-submit">
            <button type="button" id="add-habit-field" class="secondary-btn btn-block">
                <i class="fa-solid fa-plus"></i> Add Another Habit
            </button>
        </div>

        <div class="form-actions">
            <button type="submit" name="skip" class="btn btn-ghost">
                Skip for now
            </button>
            <button type="submit" class="gradient-btn btn-grow">
                Let's Go! <i class="fa-solid fa-rocket"></i>
            </button>
        </div>
    </form>
</div>
<script>
    let habitCount = 1;
    document.getElementById('add-habit-field').addEventListener('click', function() {
        habitCount++;
        const container = document.getElementById('habits-container');
        const newField = document.createElement('div');
        newField.className = 'habit-input';
        newField.innerHTML = `
            <label class="form-label">Habit ${habitCount}</label>
            <input type="text" name="habit_${habitCount}" placeholder="Habit ${habitCount}" class="text-input">
        `;
        container.appendChild(newField);
    });
</script>
{% endblock %}
