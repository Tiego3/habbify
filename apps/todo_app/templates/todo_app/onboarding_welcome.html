{% extends "todo_app/base.html" %}
{% load static %}
{% block title %}Welcome!{% endblock %}
{% block content %}
<div class="landing-card">
    <div class="app-icon">
        <i class="fa-solid fa-wand-sparkles"></i>
    </div>
    <h1>Hi gorgeous! 💖</h1>
    <p class="auth-intro">What should we call you?</p>

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <label for="custom_name" class="form-label">Your Name</label>
            <input type="text" id="custom_name" name="custom_name" placeholder="Enter your name" class="text-input" required>
        </div>

        <p class="auth-switch">This is how we'll greet you in the app</p>

        <div class="form-submit--mt">
            <button type="submit" class="gradient-btn btn-full">
                Start My Productivity Journey <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
