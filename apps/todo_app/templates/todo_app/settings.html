<!-- todo_app/templates/todo_app/settings.html -->
{% extends "todo_app/base_with_sidebar.html" %}
{% load static %}

{% block title %}Settings — Habbify{% endblock %}

{% block main_content %}
<div class="settings-wrapper">
    <h1 class="page-title">Settings</h1>

    <!-- Theme Mode Section -->
    <div class="settings-section theme-section">
        <h2 class="section-heading">Theme</h2>
        <p class="section-description">Choose your preferred appearance</p>

        <form method="POST" id="theme-form">
            {% csrf_token %}
            <input type="hidden" name="apply_colors" value="1">
            <input type="hidden" name="primary_color" value="{{ profile.primary_color }}">
            <input type="hidden" name="secondary_color" value="{{ profile.secondary_color }}">
            <input type="hidden" name="accent_color" value="{{ profile.accent_color }}">
            <input type="hidden" name="theme_mode" id="theme-mode-input" value="{{ profile.theme_mode }}">

            <div class="theme-options">
                <label class="theme-card {% if profile.theme_mode == 'light' %}active{% endif %}" data-theme="light">
                    <input type="radio" name="_theme_radio" value="light" {% if profile.theme_mode == 'light' %}checked{% endif %}>
                    <div class="theme-card-content light-mode-card">
                        <i class="fa-regular fa-sun theme-icon"></i>
                        <h3>Light</h3>
                        <p>Bright &amp; clear</p>
                    </div>
                </label>

                <label class="theme-card {% if profile.theme_mode == 'dark' %}active{% endif %}" data-theme="dark">
                    <input type="radio" name="_theme_radio" value="dark" {% if profile.theme_mode == 'dark' %}checked{% endif %}>
                    <div class="theme-card-content dark-mode-card">
                        <i class="fa-solid fa-circle-half-stroke theme-icon"></i>
                        <h3>Dark</h3>
                        <p>Easy on the eyes</p>
                    </div>
                </label>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-apply">
                    <i class="fa-solid fa-check"></i> Save
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const themeCards = document.querySelectorAll('.theme-card');
    const hiddenInput = document.getElementById('theme-mode-input');

    themeCards.forEach(card => {
        card.addEventListener('click', function() {
            const themeMode = this.getAttribute('data-theme');
            themeCards.forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            this.querySelector('input[type="radio"]').checked = true;
            hiddenInput.value = themeMode;

            if (window.ThemeManager) window.ThemeManager.update(themeMode, null);

            fetch("{% url 'update_theme_ajax' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''
                },
                body: JSON.stringify({ theme_mode: themeMode })
            });
        });
    });
});
</script>
{% endblock %}
