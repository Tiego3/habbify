{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Habbify{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✓</text></svg>">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 1. Design tokens — variables only, must be first -->
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">

    <!-- 2. Global theme system (dark/light/night modes) -->
    <link rel="stylesheet" href="{% static 'css/theme-system.css' %}">

    <!-- 3. Component classes (.btn, .input, .card, .tag, .checkbox) -->
    <link rel="stylesheet" href="{% static 'css/components.css' %}">

    <!-- 4. Auth page layout — overrides base styles for unauthenticated views -->
    <link rel="stylesheet" href="{% static 'css/auth-pages.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="auth-page">
    {% block content %}{% endblock %}
    
    {% block extra_js %}{% endblock %}
</body>
</html>
